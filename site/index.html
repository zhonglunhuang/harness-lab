<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>活動報名</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1 id="event-name">活動報名</h1>
      <p id="event-info"></p>

      <form id="signup-form" novalidate>
        <div class="field">
          <label for="name">姓名</label>
          <input id="name" name="name" type="text" autocomplete="name" />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" />
        </div>
        <div class="field">
          <label for="people">報名人數</label>
          <input id="people" name="people" type="number" min="1" value="1" />
        </div>
        <p id="form-error" class="error" role="alert" hidden></p>
        <button type="submit">送出報名</button>
      </form>

      <p id="confirmation" class="confirmation" role="status" hidden></p>
    </main>

    <script src="event-config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
